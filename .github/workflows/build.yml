name: Build & Package

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            builder-args: --linux AppImage deb rpm
          - os: windows-latest
            platform: win
            builder-args: --win nsis

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test

      - name: Build frontend & main process
        run: pnpm run build

      - name: Install Linux packaging tools (rpm)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Package installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            pnpm exec electron-builder ${{ matrix.builder-args }} --publish always
          else
            pnpm exec electron-builder ${{ matrix.builder-args }} --publish never
          fi
        shell: bash

      - name: Upload packaging artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stickie-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
