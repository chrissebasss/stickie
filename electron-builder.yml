appId: com.stickie.app
productName: Stickie
publish:
  provider: github
  owner: chrissebasss
  repo: stickie
directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - resources/icons/**/*
  - package.json

extraResources:
  - from: resources/icons
    to: icons

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icons/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Stickie

linux:
  maintainer: Chris <33810969+chrissebasss@users.noreply.github.com>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  icon: resources/icons/icon.png
  category: Utility
  desktop:
    entry:
      Name: Stickie
      Comment: Cross-platform desktop sticky notes
      StartupWMClass: stickie
      Categories: Utility;TextEditor;

