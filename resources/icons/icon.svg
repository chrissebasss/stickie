<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="stickieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Sticky Note Body -->
  <rect x="6" y="6" width="36" height="36" rx="4" fill="url(#stickieGrad)" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)" />
  <!-- Fold corner -->
  <path d="M 32 42 L 42 32 L 32 32 Z" fill="#eab308" />
  <!-- Pin head -->
  <circle cx="24" cy="11" r="2.5" fill="#ef4444" stroke="#b91c1c" stroke-width="1" />
  <!-- Lines on note -->
  <line x1="12" y1="18" x2="36" y2="18" stroke="#854d0e" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <line x1="12" y1="24" x2="30" y2="24" stroke="#854d0e" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <line x1="12" y1="30" x2="24" y2="30" stroke="#854d0e" stroke-width="2" stroke-linecap="round" opacity="0.7" />
</svg>

