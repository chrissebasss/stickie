<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft outer drop shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <!-- Main sticky note gradient (warm, vibrant sticker yellow) -->
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="25%" stop-color="#FFF176" />
      <stop offset="70%" stop-color="#FDD835" />
      <stop offset="100%" stop-color="#FBC02D" />
    </linearGradient>

    <!-- Top adhesive strip & sheen highlight -->
    <linearGradient id="topSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="12%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="28%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Adhesive band across top -->
    <linearGradient id="adhesiveBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16" />
      <stop offset="85%" stop-color="#F59E0B" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>

    <!-- Curled corner flap underside gradient -->
    <linearGradient id="curlGrad" x1="15%" y1="100%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="55%" stop-color="#FCD34D" />
      <stop offset="85%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>

    <!-- Fold spine crease highlight -->
    <linearGradient id="spineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#FDE047" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Sticky Note Body with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Main note body with peeled corner cut-out at bottom right -->
    <path d="
      M 92 56
      L 420 56
      A 28 28 0 0 1 448 84
      L 448 332
      C 448 338, 438 356, 424 372
      L 358 442
      C 342 452, 330 452, 324 452
      L 92 452
      A 28 28 0 0 1 64 424
      L 64 84
      A 28 28 0 0 1 92 56
      Z
    " fill="url(#noteGrad)" stroke="#EAB308" stroke-width="1.5" />

    <!-- Adhesive band across top (indicates sticky tape / pad adhesive) -->
    <path d="
      M 92 56
      L 420 56
      A 28 28 0 0 1 448 84
      L 448 116
      L 64 116
      L 64 84
      A 28 28 0 0 1 92 56
      Z
    " fill="url(#adhesiveBand)" />

    <!-- Top glossy paper sheen -->
    <path d="
      M 92 56
      L 420 56
      A 28 28 0 0 1 448 84
      L 448 152
      L 64 152
      L 64 84
      A 28 28 0 0 1 92 56
      Z
    " fill="url(#topSheen)" />

    <!-- Memo lines in warm amber ink (pill-shaped) -->
    <rect x="112" y="146" width="220" height="18" rx="9" fill="#92400E" fill-opacity="0.65" />
    <rect x="112" y="194" width="276" height="18" rx="9" fill="#92400E" fill-opacity="0.65" />
    <rect x="112" y="242" width="248" height="18" rx="9" fill="#92400E" fill-opacity="0.65" />
    <rect x="112" y="290" width="180" height="18" rx="9" fill="#92400E" fill-opacity="0.65" />

    <!-- Interactive checklist element: checkmark circle + task line -->
    <circle cx="128" cy="352" r="15" fill="#F59E0B" fill-opacity="0.25" stroke="#92400E" stroke-width="3.5" stroke-opacity="0.75" />
    <path d="M 121 352 L 126 357 L 137 345" fill="none" stroke="#92400E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9" />
    <rect x="156" y="343" width="136" height="18" rx="9" fill="#92400E" fill-opacity="0.65" />

    <!-- Shadow cast BY the curled flap onto the note surface behind it -->
    <path d="
      M 324 452
      Q 342 422, 386 382
      Q 422 346, 448 332
      L 378 350
      Q 338 390, 324 452
      Z
    " fill="#78350F" fill-opacity="0.38" />

    <!-- Curled corner flap (peeled upwards and forwards) -->
    <path d="
      M 324 452
      C 340 452, 376 436, 420 428
      C 436 426, 448 398, 448 374
      C 448 354, 448 338, 448 332
      Q 420 350, 386 384
      Q 350 420, 324 452
      Z
    " fill="url(#curlGrad)" stroke="#F59E0B" stroke-width="1.5" />

    <!-- Specular highlight along the fold spine crease -->
    <path d="M 324 452 Q 376 400, 448 332" fill="none" stroke="url(#spineGrad)" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
